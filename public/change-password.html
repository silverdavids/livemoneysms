<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Change Password</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #647084;
      --border: #d9e1ea;
      --primary: #1f7a5c;
      --primary-dark: #166148;
      --danger: #b42318;
      --radius: 8px;
      --shadow: 0 14px 34px rgba(23, 32, 51, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      border-top: 5px solid var(--primary);
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(430px, 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: 24px;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 15px;
      margin-top: 22px;
    }

    label {
      display: grid;
      gap: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      color: var(--text);
      background: #fff;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 122, 92, 0.16);
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: var(--radius);
      padding: 10px 15px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .form-error {
      display: none;
      color: var(--danger);
      background: #fff1f0;
      border: 1px solid #ffd5d2;
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <h1>Change Password</h1>
    <p>Your dashboard account requires a new password before continuing.</p>

    <form id="passwordForm">
      <div id="error" class="form-error"></div>

      <label>
        New Password
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      </label>

      <label>
        Confirm Password
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
      </label>

      <button id="submitButton" type="submit">Update Password</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("passwordForm");
    const errorEl = document.getElementById("error");
    const submitButton = document.getElementById("submitButton");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");

    boot();

    async function boot() {
      const response = await fetch("/api/me", { credentials: "same-origin" }).catch(() => null);
      if (!response || !response.ok) {
        window.location.href = "/";
        return;
      }

      const data = await response.json();
      if (!data.user?.mustChangePassword) {
        window.location.href = "/";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setError("");
      submitButton.disabled = true;
      submitButton.textContent = "Updating...";

      try {
        const response = await fetch("/api/change-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            password: passwordInput.value,
            confirmPassword: confirmPasswordInput.value
          })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          setError(data.error || "Could not update password.");
          return;
        }

        window.location.href = "/";
      } catch {
        setError("Could not reach the server.");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Update Password";
      }
    });

    function setError(message) {
      errorEl.textContent = message;
      errorEl.style.display = message ? "block" : "none";
    }
  </script>
</body>
</html>
